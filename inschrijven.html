<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zonfix — Inschrijven</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f5f5;min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 2px 16px rgba(0,0,0,.06);margin:20px 0}
h1{color:#e67e22;margin-bottom:8px}
.form-group{margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:.9rem}
input,select{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:1rem;transition:border .2s}
input:focus,select:focus{border-color:#f39c12;outline:none}
.btn{width:100%;padding:16px;background:#e67e22;color:#fff;border:none;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:background .2s}
.btn:hover{background:#d35400}
.success{display:none;background:#27ae60;color:#fff;padding:20px;border-radius:10px;text-align:center}
.success h3{margin-bottom:8px}
.back{display:block;text-align:center;margin:20px;color:#666;text-decoration:none}
.logo{text-align:center;font-size:2rem;margin-bottom:24px}
.logo span{color:#e67e22;font-weight:900}
</style>
</head>
<body>
<div class="container">
<div class="logo">☀️ <span>Zonfix</span></div>
<div class="card" id="form-card">
<h1>Schrijf u in</h1>
<p style="color:#666;margin-bottom:24px">Laat uw gegevens achter. Wij nemen contact op om een datum in te plannen.</p>
<form id="inschrijf-form">
<div class="form-group"><label>Naam *</label><input type="text" name="naam" required placeholder="Uw volledige naam"></div>
<div class="form-group"><label>Adres *</label><input type="text" name="adres" required placeholder="Straat + huisnummer"></div>
<div class="form-group"><label>Postcode *</label><input type="text" name="postcode" required placeholder="1234 AB"></div>
<div class="form-group"><label>Plaats *</label><input type="text" name="plaats" required placeholder="Arnhem"></div>
<div class="form-group"><label>Telefoon *</label><input type="tel" name="telefoon" required placeholder="06 12345678"></div>
<div class="form-group"><label>E-mail</label><input type="email" name="email" placeholder="uw@email.nl"></div>
<div class="form-group">
<label>Abonnement *</label>
<select name="abonnement" required>
<option value="">— Kies abonnement —</option>
<option value="Basis €85/jr">☀️ Basis — €85/jr (panelen)</option>
<option value="Comfort €175/jr">🌟 Comfort — €175/jr (panelen + dakgoot)</option>
<option value="Premium €250/jr">💎 Premium — €250/jr (alles + spoed)</option>
<option value="Weet niet">Weet ik nog niet</option>
</select>
</div>
<div class="form-group"><label>Aantal panelen</label><input type="number" name="panelen" placeholder="10" min="1" max="50"></div>
<div class="form-group"><label>Opmerkingen</label><input type="text" name="opmerkingen" placeholder="Bijv. dakgoot ook, buren doen mee..."></div>
<button type="submit" class="btn">📋 Inschrijven</button>
</form>
</div>
<div class="success" id="success-msg">
<h3>✅ Inschrijving ontvangen!</h3>
<p>Bedankt! We nemen binnen 24 uur contact op om een datum in te plannen.</p>
<p style="margin-top:12px;font-size:.85rem;opacity:.9">U ontvangt daarna de factuur met betaallink.</p>
</div>
<a href="/" class="back">← Terug naar Zonfix</a>
</div>
<script>
document.getElementById('inschrijf-form').addEventListener('submit', async function(e) {
e.preventDefault();
const form = e.target;
const data = new FormData(form);
try {
await fetch('https://formspree.io/f/xgoqnzqn', {method:'POST',body:data,headers:{'Accept':'application/json'}});
document.getElementById('form-card').style.display='none';
document.getElementById('success-msg').style.display='block';
} catch(err) {
alert('Er ging iets mis. Bel 06 57 07 92 76 om in te schrijven.');
}
});
</script>
</body>
</html>
